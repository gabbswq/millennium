name: Millennium local

on:
  push:
    branches: [develop, preview, 'feature/**']
    paths:
      - 'scripts/millennium/**'
      - 'package.json'
      - '.github/workflows/millennium.yml'
  pull_request:
    branches: [develop, preview, main]
    paths:
      - 'scripts/millennium/**'
      - 'package.json'
      - '.github/workflows/millennium.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm run test:millennium
