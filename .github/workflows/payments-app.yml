name: Millennium Checkout and sellers
on:
  push:
    branches: [develop, preview, main, 'feature/**']
    paths: ['src/**', 'scripts/payments/**', 'supabase/migrations/**', 'tests/payments/**', 'public/**', 'package*.json', 'tsconfig.json', 'next.config.mjs', 'eslint.config.mjs', '.github/workflows/payments-app.yml']
  pull_request:
    branches: [develop, preview, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: millennium_test_checkout
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-fixture-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:payments:sql
        env:
          MILLENNIUM_TEST_DATABASE_URL: postgres://postgres:disposable-fixture-only@127.0.0.1:5432/millennium_test_checkout
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run test:payments
      - run: npm run test:payments:sql
      - run: npm run build
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run test:payments:e2e
      - run: npm run test:auth:captcha:e2e
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: payments-browser-evidence
          path: test-results/
          retention-days: 7
