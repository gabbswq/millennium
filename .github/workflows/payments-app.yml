name: Millennium Checkout and sellers
on:
  push:
    branches: [develop, preview, main, 'feature/**']
    paths: ['src/**', 'supabase/migrations/**', 'tests/payments/**', 'public/**', 'package*.json', 'tsconfig.json', 'next.config.mjs', 'eslint.config.mjs', '.github/workflows/payments-app.yml']
  pull_request:
    branches: [develop, preview, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run test:payments
      - run: npm run test:payments:sql
      - run: npm run build
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run test:payments:e2e
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: payments-browser-evidence
          path: test-results/
          retention-days: 7
