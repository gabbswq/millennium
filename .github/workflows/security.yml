name: Millennium security analysis
on:
  push:
    branches: [develop, preview, main, 'feature/**']
    paths: ['src/**', 'scripts/**', 'payments-sandbox/**', 'landing/**', 'tests/security/**', '*.html', '*.js', '*.mjs', 'package*.json', '.github/**']
  pull_request:
    branches: [develop, preview, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm --prefix landing ci --ignore-scripts
      - run: npm --prefix landing run build
      - run: npm --prefix landing run check:bundle
      - run: node --test scripts/security/*.test.mjs
      - run: npx --no-install playwright install --with-deps chromium
      - run: npx --no-install playwright test --config tests/security/playwright.config.mjs
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          tools: linked
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:javascript-typescript
          upload-database: false
